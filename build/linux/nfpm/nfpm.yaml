name: "velarvo"
arch: ${GOARCH}
platform: "linux"
version: "0.1.0" # x-release-please-version
section: "devel"
priority: "extra"
maintainer: "Josef Zeman <kontakt@josefzeman.cz>"
description: "Developer workspace for SSH, SFTP, databases and APIs"
vendor: "Velarvo"
homepage: "https://velarvo.dev"
release: "1"

contents:
  - src: "./bin/velarvo"
    dst: "/usr/local/bin/velarvo"
  - src: "./build/appicon.png"
    dst: "/usr/share/icons/hicolor/128x128/apps/velarvo.png"
  - src: "./build/linux/velarvo.desktop"
    dst: "/usr/share/applications/velarvo.desktop"

depends:
  - libgtk-4-1
  - libwebkitgtk-6.0-4

overrides:
  rpm:
    depends:
      - gtk4
      - webkitgtk6.0

  archlinux:
    depends:
      - gtk4
      - webkitgtk-6.0

scripts:
  postinstall: "./build/linux/nfpm/scripts/postinstall.sh"

